# Build the shared charly-lib multi-call plugin host for amd64 + arm64 + armv7 and publish it.
#
# charly-lib is ONE statically-linked binary that hosts every welded plugin and
# dispatches it by argv[0] (github.com/opencharly/sdk/charlylib). The plugin set is
# DATA (opencharly/charly scripts/host-command-plugins.txt, fetched at charly_ref);
# the host source is GENERATED by charly-lib-gen (opencharly/sdk) and built pure-Go.
# See README.md.
#
# armv7 is the 32-bit appliance target (a JetKVM's uClibc armv7l userland, older
# 32-bit SBCs). It is the SAME third architecture the main release publishes for
# `charly` + the per-plugin tarball; without it the shared host cannot serve an
# appliance once its packaging migrates off per-plugin binaries (packagekit HARD-
# ERRORS on the retired per-plugin layout). The build needs `GOARCH=arm GOARM=7`
# (not `GOARCH=armv7`, which is not a Go arch) — the per-arch `goenv` in the
# build step owns that mapping.
name: build

on:
  workflow_dispatch:
    inputs:
      charly_ref:
        description: 'charly ref holding scripts/host-command-plugins.txt (the pins)'
        required: true
        default: main
      sdk_ref:
        description: 'opencharly/sdk ref carrying cmd/charly-lib-gen'
        required: true
        default: main
      sdk_version:
        description: 'github.com/opencharly/sdk Go module version the host requires'
        required: true
        default: v0.2026254.523
      version:
        description: 'release CalVer to tag+publish (empty = build-only)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout charly-lib
        uses: actions/checkout@v5

      - name: Checkout opencharly/sdk (the generator)
        uses: actions/checkout@v5
        with:
          repository: opencharly/sdk
          ref: ${{ inputs.sdk_ref }}
          path: .sdk

      - uses: actions/setup-go@v5
        with:
          go-version-file: .sdk/go.mod

      - name: "Fetch the welded plugin pins (single source: opencharly/charly)"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/opencharly/charly/contents/scripts/host-command-plugins.txt?ref=${{ inputs.charly_ref }}" \
            -H "Accept: application/vnd.github.raw" > pins.txt
          echo "=== pins.txt ==="; cat pins.txt

      - name: Clone each pinned plugin at its tag
        run: |
          mkdir -p .src
          while IFS=@ read -r name tag; do
            case "$name" in ''|\#*) continue;; esac
            git clone --quiet --depth 1 --branch "$tag" "https://github.com/opencharly/$name.git" ".src/$name"
            echo "cloned $name@$tag"
          done < pins.txt

      - name: Generate + build the shared host (amd64 + arm64 + armv7)
        run: |
          set -euo pipefail
          ( cd .sdk && GOWORK=off go run ./cmd/charly-lib-gen \
              -pins "$GITHUB_WORKSPACE/pins.txt" \
              -out "$GITHUB_WORKSPACE/host" \
              -module github.com/opencharly/charly-lib \
              -sdk-version "${{ inputs.sdk_version }}" )
          cd host
          while IFS=@ read -r name tag; do
            case "$name" in ''|\#*) continue;; esac
            go mod edit -replace "github.com/opencharly/$name/candy/$name=$GITHUB_WORKSPACE/.src/$name/candy/$name"
          done < "$GITHUB_WORKSPACE/pins.txt"
          GOWORK=off GOFLAGS=-mod=mod go mod tidy
          mkdir -p "$GITHUB_WORKSPACE/bin"
          # Artifact suffix -> the GOARCH/GOARM the build passes. armv7 is
          # GOARCH=arm GOARM=7; every other suffix is its own GOARCH value.
          for arch in amd64 arm64 armv7; do
            case "$arch" in
              armv7) goenv="GOARCH=arm GOARM=7" ;;
              *)     goenv="GOARCH=$arch" ;;
            esac
            env GOOS=linux $goenv CGO_ENABLED=0 go build -buildvcs=false -trimpath \
              -ldflags "-s -w" -o "$GITHUB_WORKSPACE/bin/charly-lib-linux-$arch" .
          done

      - name: Verify each built host is the right architecture
        # The cross binaries cannot execute on the amd64 runner, so the arch is
        # asserted from the ELF header. This is the gate that fails if an arch is
        # dropped from the build loop or built with the wrong GOARCH (e.g. armv7
        # built as the Go default GOARM=5, or `GOARCH=armv7` which does not exist
        # and would fail the build anyway).
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          check() { # <file> <expect-regex>
            got=$(file -b "bin/charly-lib-linux-$1")
            echo "bin/charly-lib-linux-$1: $got"
            echo "$got" | grep -qE "$2" || { echo "FAIL charly-lib-linux-$1 is not $2"; exit 1; }
          }
          check amd64 'x86-64'
          check arm64 'aarch64|ARM aarch64'
          check armv7 'ELF 32-bit LSB.*ARM, EABI5.*statically linked'
          echo "all charly-lib architectures OK"

      - name: Generate the .providers word manifests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/charly
          gh release download --repo opencharly/charly --pattern 'charly-linux-amd64' --dir /tmp/charly --clobber
          chmod +x /tmp/charly/charly-linux-amd64
          while IFS=@ read -r name tag; do
            case "$name" in ''|\#*) continue;; esac
            /tmp/charly/charly-linux-amd64 __plugin-providers "$GITHUB_WORKSPACE/.src/$name/candy/$name" \
              > "$GITHUB_WORKSPACE/bin/$name.providers"
          done < pins.txt
          echo "=== providers ==="; cat "$GITHUB_WORKSPACE"/bin/*.providers

      - name: Verify every word dispatches through the one host (serve mode)
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          mkdir -p verify
          for f in bin/*.providers; do
            n=$(basename "$f" .providers)
            cp "$f" verify/
            ln -sf "$GITHUB_WORKSPACE/bin/charly-lib-linux-amd64" "verify/$n"
          done
          fail=0
          for f in verify/*.providers; do
            n=$(basename "$f" .providers)
            h=$(timeout 3 env CHARLY_PLUGIN=charly-plugin-v1 "./verify/$n" 2>/dev/null | tail -1 || true)
            case "$h" in
              1\|2\|*) echo "OK   $n -> $h" ;;
              *)       echo "FAIL $n -> '$h'"; fail=1 ;;
            esac
          done
          [ "$fail" -eq 0 ]

      - name: Publish the release
        if: inputs.version != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ inputs.version }}
          files: |
            bin/charly-lib-linux-amd64
            bin/charly-lib-linux-arm64
            bin/charly-lib-linux-armv7
            bin/*.providers
